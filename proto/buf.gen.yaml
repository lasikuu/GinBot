version: v2

# Managed mode off: committed pkg/gen depends on the go_package values in the .proto files.
managed:
  enabled: false

# `local`, not `remote`: plugin versions are pinned by the `go install` lines in
# ci.yml and docs/SETUP.md (both must be on PATH), not by BSR release cadence.
# protoc-gen-connect-go's version must stay in step with the connectrpc.com/connect
# requirement in go.mod — the generated code's IsAtLeastVersion guard makes a
# mismatch a compile error.
plugins:
  - local: protoc-gen-go
    out: ../pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../pkg/gen
    opt: paths=source_relative
