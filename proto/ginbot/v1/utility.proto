edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_OK = 1;
  HEALTH_STATUS_ERROR = 2;
}

// No Help RPC: help is rendered client-side from pkg/command's registry, which
// the server does not hold.
service UtilityService {
  rpc HealthCheck(HealthCheckReq) returns (HealthCheckResp);
  // No timestamp: latency is measured client-side, needing no clock sync.
  rpc Ping(PingReq) returns (PingResp);
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message HealthCheckReq {}

message PingReq {}

message HealthCheckResp {
  HealthStatus status = 1;
}

message PingResp {
  string message = 1;
}
