edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "ginbot/v1/platform.proto";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

service InstanceService {
  rpc GetInstance(GetInstanceReq) returns (GetInstanceResp);
  rpc ListInstances(ListInstancesReq) returns (ListInstancesResp);
  rpc CreateInstance(CreateInstanceReq) returns (CreateInstanceResp);
  rpc UpdateInstance(UpdateInstanceReq) returns (UpdateInstanceResp);
  rpc DeleteInstance(DeleteInstanceReq) returns (DeleteInstanceResp);
}

message Instance {
  int64 id = 1;
  Platform platform_enum = 2;
  google.protobuf.Struct instance_meta = 3;
  // Default channel for announcements etc., if applicable.
  string default_channel = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetInstanceReq {
  // gt 0: id is a BIGSERIAL, and HasId() does not catch an explicit 0 (what a
  // client that forgot the field sends).
  int64 id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
}

message GetInstanceResp {
  Instance instance = 1;
}

message ListInstancesReq {
  // Unbounded; paging is clamped, not refused (see ListTriggersReq.limit).
  int64 offset = 1;
  int64 limit = 2;
}

message ListInstancesResp {
  repeated Instance instances = 1;
}

message CreateInstanceReq {
  // All three rules needed (see TriggerInstance.platform_enum): rows are keyed
  // by (platform_enum, instance_meta), so an unspecified platform writes an
  // unresolvable row.
  Platform platform_enum = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The other half of the row's identity under uq_instance_platform_meta.
  google.protobuf.Struct instance_meta = 2 [
    (buf.validate.field).required = true
  ];
  // 255 is the MXID limit (a Matrix room alias); stored verbatim and echoed back.
  string default_channel = 3 [
    (buf.validate.field).string.max_len = 255
  ];
}

message CreateInstanceResp {
  int64 id = 1;
}

message UpdateInstanceReq {
  int64 id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  Platform platform_enum = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  google.protobuf.Struct instance_meta = 3 [
    (buf.validate.field).required = true
  ];
  string default_channel = 4 [
    (buf.validate.field).string.max_len = 255
  ];
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message UpdateInstanceResp {}

message DeleteInstanceReq {
  int64 id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
}

message DeleteInstanceResp {}
