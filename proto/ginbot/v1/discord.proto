edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

enum DiscordActivity {
  DISCORD_ACTIVITY_PLAYING = 0;
  DISCORD_ACTIVITY_STREAMING = 1;
  DISCORD_ACTIVITY_LISTENING = 2;
  DISCORD_ACTIVITY_WATCHING = 3;
  DISCORD_ACTIVITY_CUSTOM = 4;
  DISCORD_ACTIVITY_COMPETING = 5;
}

service DiscordService {
  rpc SetDiscordActivityType(SetDiscordActivityTypeReq) returns (SetDiscordActivityTypeResp);
}

message SetDiscordActivityTypeReq {
  DiscordActivity status = 1;
  string name = 2;
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message SetDiscordActivityTypeResp {}
