edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "ginbot/v1/analytics.proto";
import "ginbot/v1/platform.proto";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

service TriggerService {
  rpc TryTrigger(TryTriggerReq) returns (TryTriggerResp);
  rpc ExecTrigger(ExecTriggerReq) returns (TryTriggerResp);
  rpc GetTrigger(GetTriggerReq) returns (GetTriggerResp);
  rpc ListTriggers(ListTriggersReq) returns (ListTriggersResp);
  rpc CreateTrigger(CreateTriggerReq) returns (CreateTriggerResp);
  rpc UpdateTrigger(UpdateTriggerReq) returns (UpdateTriggerResp);
  rpc DeleteTrigger(DeleteTriggerReq) returns (DeleteTriggerResp);
  rpc GetTriggerStats(GetTriggerStatsReq) returns (GetTriggerStatsResp);
  rpc GetFile(GetFileReq) returns (stream GetFileChunk);
}

// How a trigger's phrase is matched against a message.
enum TriggerMode {
  // Defaults to TRIGGER_MODE_ANY when unset.
  TRIGGER_MODE_UNSPECIFIED = 0;
  // Whole message equals the phrase, case-insensitive. Must be unique.
  TRIGGER_MODE_EXACT = 1;
  // Phrase appears anywhere in the message on a word boundary.
  TRIGGER_MODE_ANY = 2;
  // Phrase is a regular expression. Requires elevated clearance.
  TRIGGER_MODE_REGEX = 3;
}

message TriggerFile {
  string file_id = 1;
  string filename = 2;
  // Sniffed content type, never the one the URL claimed.
  string mime_type = 3;
  int64 byte_size = 4;
}

message Trigger {
  string id = 1;
  string phrase = 2;
  string reply = 3;
  string filename = 4;
  string user_id = 5;
  repeated TriggerInstance instances = 6;
  int32 chance = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  TriggerMode mode = 10;
  // Stored file reply, unset when the trigger replies with text.
  TriggerFile file = 11;
  // Display/input alias for id, global and never reused. See ADR-0039.
  int64 ref = 12;
}

message TriggerInstance {
  // All three rules are needed: `required` is a presence check an explicit
  // PLATFORM_UNSPECIFIED satisfies, `enum.defined_only` accepts 0 as a declared
  // member, and only `enum.not_in = 0` refuses the unspecified platform (which
  // would otherwise reach the DB and come back NotFound). Placed here so every
  // RPC carrying a TriggerInstance inherits them.
  Platform platform_enum = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Identifies which space is meant; required so the refusal moves to the edge
  // with a field path.
  google.protobuf.Struct instance_meta = 2 [
    (buf.validate.field).required = true
  ];
}

message TryTriggerReq {
  TriggerInstance instance = 1;
  // The full message text to match against.
  string phrase = 2;

  // Was user_id: the fire is attributed to the caller from metadata, which the
  // forced-fire rate limit is also keyed by.
  reserved 3;
  reserved user_id;

  // Forced fires bypass the chance roll and record TRIGGER_CALLED instead of
  // TRIGGER_OCCURRED. Set when the bot was mentioned. Rate limited per author.
  bool forced = 4;
}

message TryTriggerResp {
  // Unset when nothing fired.
  string id = 1;
  oneof oneof_reply {
    string reply = 2;
    TriggerFile file = 3;
  }
}

message ExecTriggerReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
  TriggerInstance instance = 2;
}

message GetTriggerReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
}

message GetTriggerResp {
  Trigger trigger = 1;
}

message ListTriggersReq {
  // Unbounded here; pkg/db clamps limit and offset rather than rejecting, so an
  // lte rule would turn a forgiving clamp into an InvalidArgument.
  int64 limit = 1;
  int64 offset = 2;
  string phrase = 3;
  string reply = 4;

  // Was user_id, superseded by `mine`.
  reserved 5;
  reserved user_id;

  repeated TriggerInstance instances = 6 [
    (buf.validate.field).repeated.max_items = 20
  ];
  google.protobuf.Timestamp period_start = 7;
  google.protobuf.Timestamp period_end = 8;
  TriggerMode mode = 9 [
    (buf.validate.field).enum.defined_only = true
  ];
  // A boolean, not a user id: the server knows the caller from metadata, so a
  // user_id could only ever echo it back after a GetUser round trip.
  bool mine = 10;
}

message ListTriggersResp {
  repeated Trigger triggers = 1;
}

message CreateTriggerReq {
  // 200 mirrors trigger.MaxPatternLength but counts characters, not bytes;
  // trigger.Compile stays authoritative. This only stops an absurd phrase
  // before it is compiled per message in regex mode.
  string phrase = 1 [
    (buf.validate.field).string.max_len = 200
  ];
  string reply = 2;
  string filename = 3;

  // Was user_id: ownership is recorded from the caller's metadata, not the body.
  reserved 4;
  reserved user_id;

  // Bounded because resolveScopeInstances makes one DB round trip per element,
  // so an unbounded list is a query multiplier. Empty means "scope to where I am".
  repeated TriggerInstance instances = 5 [
    (buf.validate.field).repeated.max_items = 20
  ];
  // 0 is the "use the default" sentinel (trigger.DefaultChance at fire time), so
  // it must stay in range. Bounds mirror the SQL CHECK on trigger.chance.
  int32 chance = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  // defined_only but not not_in = 0: UNSPECIFIED legitimately means "default to
  // ANY". defined_only still needed because enums are open — an undeclared
  // number arrives as TriggerMode(N) that no UNSPECIFIED check catches.
  TriggerMode mode = 7 [
    (buf.validate.field).enum.defined_only = true
  ];
  // Platform CDN URL; the server never trusts its extension or host without
  // checking both. Empty means "no file".
  string file_url = 8 [
    (buf.validate.field).string.max_len = 2048
  ];
}

message CreateTriggerResp {
  string id = 1;
  // Newly allocated ref, echoed so the caller can use the short form next.
  int64 ref = 2;
}

message UpdateTriggerReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
  string phrase = 2 [
    (buf.validate.field).string.max_len = 200
  ];
  string reply = 3;
  string filename = 4;

  // Was user_id: ownership is resolved from metadata and the trigger must be the
  // caller's own.
  reserved 5;
  reserved user_id;

  repeated TriggerInstance instances = 6 [
    (buf.validate.field).repeated.max_items = 20
  ];
  // 0 is the sentinel here too, so it must stay in range.
  int32 chance = 7 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  TriggerMode mode = 8 [
    (buf.validate.field).enum.defined_only = true
  ];
  string file_url = 9 [
    (buf.validate.field).string.max_len = 2048
  ];
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message UpdateTriggerResp {}

message DeleteTriggerReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
}

message DeleteTriggerResp {}

message GetTriggerStatsReq {
  TriggerInstance instance = 1;
  // Handler refuses every member but ACTION_TYPE_TRIGGER_OCCURRED and _CALLED.
  ActionType action_type = 2;
  int64 limit = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
}

message TriggerStat {
  string trigger_id = 1;
  string phrase = 2;
  int64 count = 3;
  int32 chance = 4;
  TriggerMode mode = 5;
}

message GetTriggerStatsResp {
  repeated TriggerStat stats = 1;
}

message GetFileReq {
  string file_id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message GetFileMeta {
  TriggerFile file = 1;
}

// One frame of a GetFile stream: one meta chunk first, then content chunks in
// order that concatenate to the file. A client treats an unset or unrecognised
// arm as ordinary input, not a bug.
message GetFileChunk {
  oneof chunk {
    GetFileMeta meta = 1;
    bytes content = 2;
  }
}
