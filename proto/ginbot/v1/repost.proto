edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

// Recognises a link or attachment the community has already seen. One RPC:
// ingest and match are the same call so a client cannot remember without
// looking up. Instance and destination come from origin metadata, not the body,
// so a caller cannot read or seed another guild's index.
service RepostService {
  rpc CheckRepost(CheckRepostReq) returns (CheckRepostResp);
}

enum RepostKind {
  REPOST_KIND_UNSPECIFIED = 0;
  // A URL, identified by its canonical source key.
  REPOST_KIND_LINK = 1;
  // A still image, fingerprinted perceptually and exactly.
  REPOST_KIND_IMAGE = 2;
  // Video or animated GIF, fingerprinted on its first frame where possible, and exactly.
  REPOST_KIND_VIDEO = 3;
  // Anything else, fingerprinted exactly only.
  REPOST_KIND_FILE = 4;
}

// A perceptual match is graded by Hamming distance; a canonical-link or
// exact-bytes match is always IDENTICAL.
enum RepostConfidence {
  // No match.
  REPOST_CONFIDENCE_UNSPECIFIED = 0;
  // Distance 0: re-upload or lossless re-encode.
  REPOST_CONFIDENCE_IDENTICAL = 1;
  // Recompression, quality change, rescale. The common repost.
  REPOST_CONFIDENCE_HIGH = 2;
  // A heavier edit: watermark, border, colour shift, format conversion.
  REPOST_CONFIDENCE_PROBABLE = 3;
}

// Platform-agnostic reference so a client can deep-link the original and name
// its poster without a second lookup.
message MessageRef {
  string instance_uid = 1;
  string destination_uid = 2;
  string message_uid = 3;
  // A platform snowflake, never the user_account UUID; the client renders a mention.
  string author_uid = 4;
}

message RepostCandidate {
  // All three rules needed; see TriggerInstance.platform_enum in trigger.proto.
  RepostKind kind = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // For LINK, the URL as posted (server canonicalises). Otherwise the CDN URL to
  // fetch, subject to the same host allow-list as trigger media.
  string url = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
}

message CheckRepostReq {
  // Capped so one message cannot cost an unbounded number of fetches.
  repeated RepostCandidate candidates = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 20
  ];
  string message_uid = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Presentation data (names the original poster); authorization identity still
  // comes from metadata.
  string author_uid = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // An edit matches but never inserts, so a message cannot match itself.
  bool edit = 4;
  // Defaults to the server's clock when unset.
  google.protobuf.Timestamp posted_at = 5;
}

message RepostMatch {
  // Index into CheckRepostReq.candidates.
  int32 candidate_index = 1;
  // Kind of the original entry, which may differ from the candidate's own kind.
  RepostKind kind = 2;
  RepostConfidence confidence = 3;
  // Zero for a canonical-link or exact-bytes match (not graded by distance).
  int32 distance = 4;
  google.protobuf.Timestamp original_posted_at = 5;
  // Any field may be empty for a platform that does not carry it.
  MessageRef original_ref = 6;
}

message CheckRepostResp {
  // In candidate order; empty when nothing matched (not an error).
  repeated RepostMatch matches = 1;
}
