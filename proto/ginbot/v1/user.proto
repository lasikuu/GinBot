edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

enum Clearance {
  CLEARANCE_UNSPECIFIED = 0;
  CLEARANCE_REGISTERED = 1;
  CLEARANCE_MEMBER = 10;
  CLEARANCE_MODERATOR = 20;
  CLEARANCE_ADMINISTRATOR = 50;
  CLEARANCE_OWNER = 100;
}

service UserService {
  rpc GetUser(GetUserReq) returns (GetUserResp);
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc GetCongratulableBirthdays(GetCongratulableBirthdaysReq) returns (GetCongratulableBirthdaysResp);
  rpc SetLocale(SetLocaleReq) returns (SetLocaleResp);
  rpc SetTimezone(SetTimezoneReq) returns (SetTimezoneResp);
}

message User {
  string id = 1;
  string username = 2;
  Clearance clearance = 3;
  string avatar = 4;
  string locale = 5;
  string timezone = 6;
  google.protobuf.Timestamp birthday = 7;
  google.protobuf.Timestamp last_congratulated_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message GetUserReq {
  string id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message GetUserResp {
  User user = 1;
}

message RegisterReq {
  // Was (platform, platform_user_id): identity now comes only from metadata.
  // Not authentication — the client asserts identity and the server trusts it.
  reserved 1, 2;
  reserved platform, platform_user_id;

  google.protobuf.Struct platform_metadata = 3;
  // Not required for new registrations.
  string verification_code = 4;
  string username = 5;
  string locale = 6;
}

message RegisterResp {
  string user_id = 1;
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message GetCongratulableBirthdaysReq {}

message GetCongratulableBirthdaysResp {
  repeated User users = 1;
}

// No user id: the caller is identified from metadata. Adding one would let a
// client act on someone else's account.
message SetLocaleReq {
  // Supported: en, fi, ja.
  string locale = 1 [
    (buf.validate.field).string.pattern = "^(en|fi|ja)$"
  ];
}

message SetLocaleResp {}

// No user id; see SetLocaleReq.
message SetTimezoneReq {
  // IANA timezone name, e.g. Europe/Helsinki.
  string timezone = 1 [
    (buf.validate.field).string.min_len = 1
  ];
}

message SetTimezoneResp {}
