edition = "2023";

package ginbot.v1;

option go_package = "github.com/lasikuu/GinBot/pkg/gen/ginbot/v1;ginbotv1";

import "ginbot/v1/platform.proto";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;

enum ReminderStatus {
  REMINDER_STATUS_UNSPECIFIED = 0;
  REMINDER_STATUS_PENDING = 1;
  REMINDER_STATUS_SENT = 2;
  REMINDER_STATUS_DELIVERED = 3;
  REMINDER_STATUS_FAILED = 4;
}

service ReminderService {
  rpc GetReminder(GetReminderReq) returns (GetReminderResp);
  rpc ListReminders(ListRemindersReq) returns (ListRemindersResp);
  rpc CreateReminder(CreateReminderReq) returns (CreateReminderResp);
  rpc UpdateReminder(UpdateReminderReq) returns (UpdateReminderResp);
  rpc DeleteReminder(DeleteReminderReq) returns (DeleteReminderResp);
  // Reports the outcome of a pushed notification. The server marks a reminder
  // SENT on push and only advances it to DELIVERED (or reschedules) on confirm;
  // an unconfirmed reminder is reclaimed and retried.
  rpc ConfirmDelivery(ConfirmDeliveryReq) returns (ConfirmDeliveryResp);
}

message Reminder {
  string id = 1;
  google.protobuf.Timestamp datetime = 2;
  string timezone = 3;
  string repeat_cron = 4;
  ReminderDestination destination = 5;
  ReminderStatus status = 6;
  string user_id = 7;
  string message = 8;
  string parent_id = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Display/input alias for id, unique per owner. See ADR-0039.
  int64 ref = 12;
}

message ReminderDestination {
  // All three rules needed; see TriggerInstance.platform_enum in trigger.proto.
  Platform platform_enum = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  google.protobuf.Struct instance_meta = 2 [
    (buf.validate.field).required = true
  ];
  google.protobuf.Struct destination_meta = 3 [
    (buf.validate.field).required = true
  ];
}

message GetReminderReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
}

message GetReminderResp {
  Reminder reminder = 1;
}

message ListRemindersReq {
  int64 limit = 1;
  int64 offset = 2;
  string message = 3;

  // Was user_id: reminders are private, so the listing is scoped to the caller
  // from metadata; the field could only have been an enumeration surface.
  reserved 4;
  reserved user_id;

  google.protobuf.Timestamp period_start = 5;
  google.protobuf.Timestamp period_end = 6;
  ReminderStatus status = 7;
}

message ListRemindersResp {
  repeated Reminder reminders = 1;
}

message CreateReminderReq {
  google.protobuf.Timestamp datetime = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  string timezone = 2;
  string message = 3;
  ReminderDestination destination = 4;
  // Shape check only: field values are not range-checked (the real cron parser
  // does that), erring toward acceptance so a false rejection can't block a reminder.
  string repeat_cron = 5 [
    (buf.validate.field).string.pattern = "^(@(annually|yearly|monthly|weekly|daily|midnight|hourly|reboot)|@every[ \\t]+(\\d+(ns|us|µs|ms|s|m|h))+|(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?)(,(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?))*([ \\t]+(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?)(,(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?))*){4,5})$"
  ];
  string parent_id = 6 [
    (buf.validate.field).string.uuid = true
  ];
}

message CreateReminderResp {
  string id = 1;
  // Newly allocated ref, echoed so the caller can use the short form next.
  int64 ref = 2;
}

message UpdateReminderReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
  google.protobuf.Timestamp datetime = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  string timezone = 3;
  string message = 4;
  ReminderDestination destination = 5;
  // Patch-shaped: unset leaves the stored schedule untouched; empty string is
  // the "clear the repeat" sentinel (hence the trailing `?`, absent on create).
  string repeat_cron = 6 [
    (buf.validate.field).string.pattern = "^(@(annually|yearly|monthly|weekly|daily|midnight|hourly|reboot)|@every[ \\t]+(\\d+(ns|us|µs|ms|s|m|h))+|(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?)(,(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?))*([ \\t]+(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?)(,(\\*(/\\d+)?|(\\d+|[A-Za-z]{3})(-(\\d+|[A-Za-z]{3}))?(/\\d+)?))*){4,5})?$"
  ];
  string parent_id = 7 [
    (buf.validate.field).string.uuid = true
  ];
}

// Empty and named rather than google.protobuf.Empty so it can gain a field
// later and to satisfy buf's RPC_REQUEST_RESPONSE_UNIQUE.
message UpdateReminderResp {}

message DeleteReminderReq {
  // Accepts a canonical uuid or a positive decimal ref. See ADR-0039.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[1-9][0-9]{0,17})$"
  ];
}

message DeleteReminderResp {}

message ConfirmDeliveryReq {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // False (channel gone and DM fallback failed, or bot blocked) records the
  // failure rather than retrying forever.
  bool delivered = 2;
}

message ConfirmDeliveryResp {}