version: v2
# Keep this BSR-pinned protovalidate commit (buf.lock) in step with the
# buf.build/gen/go/bufbuild/protovalidate/... requirement in go.mod: the
# registered and resolved extension descriptors must share one schema.
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - BASIC
# FILE, not WIRE: pkg/gen is committed and compiled against, so a wire-compatible
# rename breaks the build across cmd/, pkg/discord and pkg/matrix. Adding a field
# and deprecating an RPC still pass.
breaking:
  use:
    - FILE
