services:
  psql:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=gin123
      - POSTGRES_USER=ginbot
    volumes:
      - ginbot_dev_pgdata:/var/lib/postgresql/data

volumes:
  ginbot_dev_pgdata:
