services:
  psql:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=gin123
      - POSTGRES_USER=ginbot
    volumes:
      # PG18+ images store data in a version-specific subdirectory and expect the
      # mount at /var/lib/postgresql, not .../data (docker-library/postgres#1259).
      - ginbot_dev_pgdata:/var/lib/postgresql

volumes:
  ginbot_dev_pgdata:
