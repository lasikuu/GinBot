# The server certificate's SANs must cover every name a client dials it by, or
# the handshake fails hostname verification: internal/auth.ClientTLSConfig
# sets neither ServerName nor InsecureSkipVerify, deliberately, so there is no
# escape hatch.
#
# ginbot-server is the Compose service name and the value of GINBOT_GRPC_HOST
# in docker-compose.prod.yml, which is what GRPCServerOptions.ClientBaseURL
# turns into the URL both platform clients dial. localhost covers running the
# three binaries directly on one host. Change either of those and change this.
subjectAltName=DNS:ginbot-server,DNS:localhost,DNS:*.lasikuu.jp,IP:127.0.0.1,IP:0.0.0.0
