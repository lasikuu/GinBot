# Core (psql + ginbot-server) always starts; requires GINBOT_DB_PASSWORD, which
# the psql service maps onto the POSTGRES_PASSWORD its image demands. The Discord
# and Matrix clients are optional, gated behind Compose profiles set via
# COMPOSE_PROFILES in .env. No `build:` block here; images come from ghcr.io
# (ADR 0036). A client's secrets are only needed when its profile is active.

x-ginbot-env: &ginbot-env
  GINBOT_ENV: production
  GINBOT_LOG_LEVEL: info
  # Address the CLIENTS dial. ginbot-server overrides it, since the same var is
  # also what the server binds (see the override on that service).
  GINBOT_GRPC_HOST: ginbot-server
  GINBOT_GRPC_PORT: "50051"
  # The cert mount on all three services is unconditional and safe with TLS off.
  # cert/server-ext.conf must carry a SAN matching GINBOT_GRPC_HOST or every
  # client handshake fails hostname verification (auth.ClientTLSConfig sets
  # neither ServerName nor InsecureSkipVerify).
  GINBOT_GRPC_TLS: ${GINBOT_GRPC_TLS:-false}
  # The bot's own public host (and its subdomains) is excluded from repost
  # indexing. Set nothing broader than the bot's own host.
  GINBOT_WEB_URL: ${GINBOT_WEB_URL:-}
  # Read on BOTH sides: server fingerprints, Discord client requests the
  # privileged MESSAGE_CONTENT intent when on (ADR 0024) — hence the anchor.
  # Video/GIF fingerprinting also needs ffmpeg on PATH, which the images do not
  # carry (ADR 0006); its absence degrades those to exact-hash-only.
  GINBOT_REPOST: ${GINBOT_REPOST:-false}
  GINBOT_REPOST_EXCLUDED_HOSTS: ${GINBOT_REPOST_EXCLUDED_HOSTS:-}
  GINBOT_REPOST_FFMPEG_PATH: ${GINBOT_REPOST_FFMPEG_PATH:-}
  # Numeric repost knobs keep their internal/config defaults; add here only to move them.
  GINBOT_DB_HOST: psql
  GINBOT_DB_PORT: "5432"
  GINBOT_DB_NAME: ginbot
  GINBOT_DB_USERNAME: ginbot
  GINBOT_DB_PASSWORD: ${GINBOT_DB_PASSWORD:?GINBOT_DB_PASSWORD is required}

services:
  psql:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ginbot
      POSTGRES_DB: ginbot
      # Key must be POSTGRES_PASSWORD (the image reads only that); value comes
      # from GINBOT_DB_PASSWORD so .env carries the secret once.
      POSTGRES_PASSWORD: ${GINBOT_DB_PASSWORD:?GINBOT_DB_PASSWORD is required}
    volumes:
      - ginbot_prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ginbot -d ginbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host; only reachable on the compose network.

  ginbot-server:
    image: ghcr.io/lasikuu/ginbot-server:latest
    restart: unless-stopped
    environment:
      <<: *ginbot-env
      # Bind all interfaces: the server binds GINBOT_GRPC_HOST, and the
      # in-container healthcheck dials loopback, so binding the service name
      # would leave 127.0.0.1 unbound and the container never healthy. Not extra
      # exposure — no port is published. cmd/ginbot-server/compose_test.go pins this.
      GINBOT_GRPC_HOST: "0.0.0.0"
      # Trigger media is persistent state (ADR 0007), not cache: the default
      # ./storage is the container's writable layer and dies with the container,
      # leaving file rows pointing at gone blobs. Mounted below.
      GINBOT_STORAGE_PATH: /app/storage
    volumes:
      - ./cert:/app/cert:ro
      - ginbot_prod_storage:/app/storage
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      # The binary probes itself, not wget: under GINBOT_GRPC_TLS=true the
      # listener requires a client cert (RequireAndVerifyClientCert) that wget
      # cannot present, and both clients gate on service_healthy. Running the
      # binary reuses the same TLS/port/certs env, so the probe cannot drift.
      test: ["CMD", "/usr/local/bin/ginbot-server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Roughly covers migrations (run before the listener opens) so ps reports
      # "starting"; the 50s of retries after it is what actually protects boot.
      start_period: 30s
    # Must exceed shutdownDrainDelay + shutdownTimeout (main.go, 15s worst case)
    # or the runtime SIGKILLs mid-drain and db.CloseDB / log.Sync never run.
    stop_grace_period: 30s

  ginbot-discord:
    # Started only under the `discord` profile.
    profiles: ["discord"]
    image: ghcr.io/lasikuu/ginbot-discord:latest
    restart: unless-stopped
    environment:
      <<: *ginbot-env
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_COMMAND_PREFIXES: ${DISCORD_COMMAND_PREFIXES:-}
      DISCORD_REMOVE_COMMANDS: ${DISCORD_REMOVE_COMMANDS:-false}
      # Opt-in: asks Discord for a privileged intent (ADR 0024).
      DISCORD_MESSAGE_CONTENT: ${DISCORD_MESSAGE_CONTENT:-false}
    volumes:
      - ./cert:/app/cert:ro
    depends_on:
      ginbot-server:
        condition: service_healthy

  ginbot-matrix:
    # Started only under the `matrix` profile.
    profiles: ["matrix"]
    image: ghcr.io/lasikuu/ginbot-matrix:latest
    restart: unless-stopped
    environment:
      <<: *ginbot-env
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_USER_ID: ${MATRIX_USER_ID:-}
    volumes:
      - ./cert:/app/cert:ro
    depends_on:
      ginbot-server:
        condition: service_healthy

volumes:
  ginbot_prod_pgdata:
  # Only ginbot-server mounts this; the clients never touch storage.
  ginbot_prod_storage:
