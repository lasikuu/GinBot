name: "Publish images"

# Three images, one per Dockerfile stage, to ghcr.io/lasikuu/ginbot-{server,discord,matrix}.
# Does NOT wait for CI (ADR 0036): :main/:edge/:sha-* have no green-build guarantee.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Serialise per-ref so overlapping runs don't race on the mutable :main/:edge
# tags. Tag refs are unique, so a release build is never the one cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # attest-build-provenance mints a Sigstore signing cert from the OIDC token.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - target: server
          image: ginbot-server
          description: "GinBot Connect API server: owns Postgres, migrations and cron."
        - target: discord
          image: ginbot-discord
          description: "GinBot Discord client. Talks to ginbot-server over Connect."
        - target: matrix
          image: ginbot-matrix
          description: "GinBot Matrix client. Talks to ginbot-server over Connect."

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No {{major}} pattern: pre-1.0 a moving :0 across breaking minor bumps
    # misleads. format=long because the sha tag is meant for pinning.
    - name: Derive tags and labels
      id: meta
      uses: docker/metadata-action@v5
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,format=long
          type=raw,value=edge,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=${{ matrix.image }}
          org.opencontainers.image.description=${{ matrix.description }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        target: ${{ matrix.target }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
        sbom: ${{ github.event_name != 'pull_request' }}
        # Per-image scope: a shared scope would have the three concurrent jobs
        # overwrite each other's cache manifest.
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,scope=${{ matrix.image }},mode=max

    - name: Attest build provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v3
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    - name: Summarise
      if: github.event_name != 'pull_request'
      env:
        IMAGE: ${{ matrix.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        {
          echo "### ${IMAGE}"
          echo
          echo "Digest: \`${DIGEST}\`"
          echo
          echo '```'
          echo "${TAGS}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
