name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Tracks the `go` directive in go.mod instead of a second hardcoded version.
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Build
      run: go build ./...

    # `-structtag=false` is required: plain `go vet` rejects the generated
    # opaque protobuf structs in pkg/gen.
    - name: Vet
      run: go vet -structtag=false ./...

    # `gofmt -l` exits 0 even when it lists files, so fail on any output.
    - name: Check formatting
      run: |
        unformatted="$(gofmt -l cmd internal pkg)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt reported unformatted files"
          echo "$unformatted"
          exit 1
        fi

    # -race matters here: the reverse action stream is concurrent on both the
    # server and the client side. -covermode=atomic rather than the default
    # `set` because it is the only mode -race supports.
    - name: Unit tests
      run: go test -race -cover -covermode=atomic -coverprofile=coverage.out ./...

    # Printed, not gated on a threshold: a number that fails the build invites
    # tests written to move the number. These packages are at or near zero on
    # purpose, so read the total with them in mind:
    #
    #   cmd/ginbot-discord, cmd/ginbot-matrix, cmd/ginbot-server
    #       thin main() wiring, exercised end to end rather than by unit tests.
    #   pkg/enum                constant declarations only, nothing to exercise.
    #   pkg/log                 a thin wrapper over zap.
    #   pkg/grpc/service        package-level singleton wiring.
    #   pkg/matrix              needs a fake mautrix session, a seam not yet
    #                           worth its cost.
    #   pkg/db                  covered by the integration-test job instead; its
    #                           tests are all behind the `integration` build tag
    #                           and so contribute nothing to this profile.
    #   pkg/gen/ginbot/proto    generated code, guarded by the generated-code
    #                           job.
    #
    # pkg/gen is stripped from the profile first: it is the largest body of code
    # in the repository and is generated, so leaving it in makes the total a
    # measure of how much the generator emitted rather than of what is tested. The
    # deliberate-zero list is echoed so the criterion is evidenced by the job
    # output and not only by this comment.
    - name: Coverage total
      run: |
        grep -v '/pkg/gen/' coverage.out > coverage.hand-written.out
        echo "Total over hand-written packages (pkg/gen excluded):"
        go tool cover -func=coverage.hand-written.out | tail -n 1
        echo "Deliberately at or near zero: cmd/ginbot-{discord,matrix,server}, pkg/enum,"
        echo "pkg/log, pkg/grpc/service, pkg/matrix, pkg/db (integration job), pkg/gen (generated)."

    # `go test` discards t.Log output from a PASSING test, so the pHash chunk
    # selectivity table the test exists to produce never reaches the log above.
    # This re-runs that one test with -v to print it. It is cheap: the package
    # is already built and the corpus takes well under a second.
    - name: Report pHash chunk selectivity
      run: go test -v -count=1 -run TestPigeonholeChunkSelectivity ./pkg/repost/fingerprint/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # Pinned, and installed with `go install` rather than the marketplace
    # action, exactly like the generated-code job's protoc plugins: the version
    # that decides whether this repository passes is then a line in this file
    # and not an action's own release cadence.
    #
    # Keep this at or ahead of the `go` directive in go.mod. golangci-lint
    # type-checks through the x/tools it vendors, so an older release reading a
    # newer toolchain's export data fails outright with `typecheck: could not
    # load export data` instead of reporting findings — and that failure cannot
    # be excluded from the config.
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

    # Fails on a malformed or outdated .golangci.yml, which otherwise degrades
    # silently into "no linters ran, nothing found".
    - name: Verify lint configuration
      run: golangci-lint config verify

    - name: Lint
      run: golangci-lint run

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # buf breaking below reads history out of ../.git. The default
        # checkout is shallow (fetch-depth 1) and fetches only the ref under
        # test, so neither the baseline commit on a push nor origin/main on a
        # pull request is present and buf fails to resolve the ref outright.
        # It errors rather than silently comparing against something wrong,
        # but it errors on every run, so the check would be permanently red.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # buf, not protoc: it resolves the protovalidate schema from the BSR at the
    # commit pinned in proto/buf.lock, so no copy of it is vendored in proto/.
    # Pinned like everything else here.
    - name: Install buf
      run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

    # Pinned to the versions that produced the committed output.
    #
    # protoc-gen-connect-go must stay in step with the connectrpc.com/connect
    # requirement in go.mod. The generated files assert the runtime is new enough
    # with a connect.IsAtLeastVersion... constant, so a plugin newer than the
    # module breaks the build rather than degrading quietly — and the reverse
    # drift is invisible until a newer generator feature is needed.
    - name: Install protoc plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
        go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

    # proto/buf.yaml has configured lint since it was added, but nothing ran it.
    - name: Lint protos
      run: cd proto && buf lint

    # The baseline differs by event, and getting it wrong makes the check
    # either permanently red or permanently vacuous.
    #
    #   - On a pull request, actions/checkout leaves a DETACHED HEAD at
    #     refs/pull/N/merge and creates no local refs/heads/main, so
    #     `#branch=main` cannot resolve however deep the fetch is. The branch
    #     exists only as the remote-tracking refs/remotes/origin/main, which
    #     is what has to be named.
    #   - On a push to main the ref under test IS main, so comparing against
    #     it would diff main's proto/ against itself and could only ever pass.
    #     This repository pushes to main directly, so skipping the check there
    #     would leave the ordinary path completely uncovered. The baseline is
    #     github.event.before — the tip of main BEFORE the push — and not
    #     HEAD~1: a push carrying more than one commit is the normal case here,
    #     and HEAD~1 would then compare the push against its own second-to-last
    #     commit, so a break introduced anywhere but the final commit would be
    #     present in both sides and pass unnoticed.
    #
    # Two push cases have no usable baseline and are skipped rather than
    # failed: a brand new branch, where github.event.before is all zeros, and a
    # force push, where it names a commit that is no longer reachable. Both fall
    # back to HEAD~1, and the initial commit — which has no HEAD~1 either — is
    # skipped outright, there being nothing to be compatible with yet.
    #
    # --exclude-imports scopes the check to this repository's own files. Without
    # it buf compares the protovalidate schema too, which is a BSR dependency
    # pinned in proto/buf.lock, so bumping that pin (AGENTS.md requires moving
    # it in step with go.mod) would report a dozen breaking changes in
    # buf/validate/validate.proto that no proto edit here could ever fix. It
    # does NOT weaken the check on our own schema: deleting one of our files,
    # messages, fields or RPCs is still reported.
    - name: Breaking change check
      run: |
        zero='0000000000000000000000000000000000000000'
        before='${{ github.event.before }}'
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          against='../.git#ref=refs/remotes/origin/main,subdir=proto'
        elif [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
          against="../.git#ref=${before},subdir=proto"
        elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
          echo "No usable github.event.before; falling back to HEAD~1."
          against='../.git#ref=HEAD~1,subdir=proto'
        else
          echo "No previous commit to compare against; skipping."
          exit 0
        fi
        echo "Comparing proto/ against ${against}"
        cd proto && buf breaking --against "$against" --exclude-imports

    # The same class of silent drift as the protovalidate pin below, one layer
    # up: the generator and the runtime it generates against are two independent
    # pins that have to agree. Asserted against the INSTALLED plugin rather than
    # against the `go install` line above, so the check cannot be satisfied by
    # editing the line it is checking.
    - name: Verify the connect plugin matches the connect runtime
      run: |
        go_version="$(sed -n 's|^[[:space:]]*connectrpc\.com/connect v\([0-9.]*\).*|\1|p' go.mod)"
        plugin_version="$(protoc-gen-connect-go --version)"
        if [ -z "$go_version" ]; then
          echo "::error::could not read the connectrpc.com/connect version from go.mod"
          exit 1
        fi
        if [ "$go_version" != "$plugin_version" ]; then
          echo "::error::protoc-gen-connect-go is ${plugin_version} but go.mod requires connect ${go_version}."
          echo "Move both together: the 'Install protoc plugins' step above and the go.mod requirement."
          exit 1
        fi

    # The protovalidate schema that codegen reads (pinned in proto/buf.lock) and
    # the generated Go that registers its extensions (required in go.mod) have to
    # be the same BSR commit. The Go module version embeds that commit's
    # 12-character prefix, so assert it against the commit in buf.lock. Drift is
    # silent otherwise: everything still compiles, and a constraint the schema
    # declares is simply not one the runtime validator can resolve.
    #
    # Deliberately not `buf dep update && git diff buf.lock`: that asserts the
    # pin is upstream's latest, which turns this job red on an unrelated
    # protovalidate release.
    - name: Verify the protovalidate pin matches go.mod
      run: |
        go_commit="$(sed -n \
          's|.*buf\.build/gen/go/bufbuild/protovalidate/protocolbuffers/go v[0-9.]*-[0-9]*-\([0-9a-f]*\)\..*|\1|p' \
          go.mod)"
        if [ -z "$go_commit" ]; then
          echo "::error::could not read the protovalidate module version from go.mod"
          exit 1
        fi
        if ! grep -q "commit: ${go_commit}" proto/buf.lock; then
          echo "::error::proto/buf.lock is not pinned to BSR commit ${go_commit} from go.mod."
          echo "Run 'cd proto && buf dep update' and align the go.mod requirement, or vice versa."
          grep 'commit:' proto/buf.lock
          exit 1
        fi

    # pkg/gen is committed but generated by hand, so it can drift from proto/
    # silently. The comparison is exact: buf reports no compiler version to the
    # plugins, so the `protoc (unknown)` line in every generated header is the
    # same on every machine. A raw protoc stamps its own version there instead,
    # which is why this used to need an --ignore-matching-lines exemption.
    - name: Regenerate and compare
      run: |
        cd proto && buf generate && cd ..
        if ! git diff --quiet -- pkg/gen; then
          echo "::error::pkg/gen is out of date with proto/. Regenerate and commit."
          git diff -- pkg/gen
          exit 1
        fi

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest

    services:
      # Matches docker-compose.psql.yml; these are local development credentials,
      # not secrets. POSTGRES_DB is explicit here, the compose file relies on it
      # defaulting to POSTGRES_USER.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ginbot
          POSTGRES_PASSWORD: gin123
          POSTGRES_DB: ginbot
        ports:
        - 5432:5432
        # TestMain connects as soon as the binary starts, so gate the job on
        # readiness rather than racing the container boot.
        options: >-
          --health-cmd "pg_isready -U ginbot -d ginbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # The test binary runs the embedded goose migrations itself via
    # EnsureLatestVersion, so nothing applies them here. `-count=1` stops the Go
    # test cache from replaying a pass against a database it never touched.
    - name: Integration tests
      env:
        GINBOT_DB_HOST: localhost
        GINBOT_DB_PORT: "5432"
        GINBOT_DB_NAME: ginbot
        GINBOT_DB_USERNAME: ginbot
        GINBOT_DB_PASSWORD: gin123
        GINBOT_LOG_LEVEL: error
      run: go test -tags=integration -race -count=1 ./...
