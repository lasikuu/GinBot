name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Build
      run: go build ./...

    # -structtag=false: plain go vet rejects the opaque protobuf structs in pkg/gen.
    - name: Vet
      run: go vet -structtag=false ./...

    # gofmt -l exits 0 even when it lists files, so fail on any output.
    - name: Check formatting
      run: |
        unformatted="$(gofmt -l cmd internal pkg)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt reported unformatted files"
          echo "$unformatted"
          exit 1
        fi

    # -covermode=atomic: the only mode -race supports.
    - name: Unit tests
      run: go test -race -cover -covermode=atomic -coverprofile=coverage.out ./...

    # pkg/gen (generated) is stripped so the total measures tested code, not
    # generator output. Some packages are at or near zero on purpose (thin
    # main() wiring, pkg/db behind the integration tag, generated code).
    - name: Coverage total
      run: |
        grep -v '/pkg/gen/' coverage.out > coverage.hand-written.out
        echo "Total over hand-written packages (pkg/gen excluded):"
        go tool cover -func=coverage.hand-written.out | tail -n 1
        echo "Deliberately at or near zero: cmd/ginbot-{discord,matrix,server}, pkg/enum,"
        echo "pkg/log, pkg/grpc/service, pkg/matrix, pkg/db (integration job), pkg/gen (generated)."

    # go test discards t.Log from a passing test; -v re-run prints the pHash
    # chunk-selectivity table this test exists to produce.
    - name: Report pHash chunk selectivity
      run: go test -v -count=1 -run TestPigeonholeChunkSelectivity ./pkg/repost/fingerprint/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # Keep at or ahead of go.mod's go directive: golangci-lint reading a newer
    # toolchain's export data fails outright rather than reporting findings.
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

    # Fails on a malformed config, which otherwise degrades to "no linters ran".
    - name: Verify lint configuration
      run: golangci-lint config verify

    - name: Lint
      run: golangci-lint run

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # buf breaking below reads history out of ../.git; a shallow checkout
        # lacks the baseline ref and fails to resolve it.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # buf, not protoc: it resolves the protovalidate schema from the BSR commit
    # pinned in proto/buf.lock, so no copy is vendored.
    - name: Install buf
      run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

    # Versions that produced the committed output. protoc-gen-connect-go must
    # match the connectrpc.com/connect requirement in go.mod.
    - name: Install protoc plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
        go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

    - name: Lint protos
      run: cd proto && buf lint

    # Baseline differs by event: origin/main on a PR (checkout leaves a detached
    # HEAD with no local main), github.event.before on a push (not HEAD~1, which
    # would miss breaks in all but the last commit of a multi-commit push). New
    # branches and force pushes have no usable baseline and fall back to HEAD~1.
    # --exclude-imports keeps the protovalidate pin from reporting unfixable
    # breaks in buf/validate/validate.proto; our own files are still checked.
    - name: Breaking change check
      run: |
        zero='0000000000000000000000000000000000000000'
        before='${{ github.event.before }}'
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          against='../.git#ref=refs/remotes/origin/main,subdir=proto'
        elif [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
          against="../.git#ref=${before},subdir=proto"
        elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
          echo "No usable github.event.before; falling back to HEAD~1."
          against='../.git#ref=HEAD~1,subdir=proto'
        else
          echo "No previous commit to compare against; skipping."
          exit 0
        fi
        echo "Comparing proto/ against ${against}"
        cd proto && buf breaking --against "$against" --exclude-imports

    # Asserted against the installed plugin, not the go install line above, so
    # it cannot be satisfied by editing the line it checks.
    - name: Verify the connect plugin matches the connect runtime
      run: |
        go_version="$(sed -n 's|^[[:space:]]*connectrpc\.com/connect v\([0-9.]*\).*|\1|p' go.mod)"
        plugin_version="$(protoc-gen-connect-go --version)"
        if [ -z "$go_version" ]; then
          echo "::error::could not read the connectrpc.com/connect version from go.mod"
          exit 1
        fi
        if [ "$go_version" != "$plugin_version" ]; then
          echo "::error::protoc-gen-connect-go is ${plugin_version} but go.mod requires connect ${go_version}."
          echo "Move both together: the 'Install protoc plugins' step above and the go.mod requirement."
          exit 1
        fi

    # buf.lock and go.mod must pin the same protovalidate BSR commit (the Go
    # module version embeds its 12-char prefix), else the schema and the runtime
    # validator disagree silently. Not `buf dep update`, which would go red on
    # any unrelated upstream release.
    - name: Verify the protovalidate pin matches go.mod
      run: |
        go_commit="$(sed -n \
          's|.*buf\.build/gen/go/bufbuild/protovalidate/protocolbuffers/go v[0-9.]*-[0-9]*-\([0-9a-f]*\)\..*|\1|p' \
          go.mod)"
        if [ -z "$go_commit" ]; then
          echo "::error::could not read the protovalidate module version from go.mod"
          exit 1
        fi
        if ! grep -q "commit: ${go_commit}" proto/buf.lock; then
          echo "::error::proto/buf.lock is not pinned to BSR commit ${go_commit} from go.mod."
          echo "Run 'cd proto && buf dep update' and align the go.mod requirement, or vice versa."
          grep 'commit:' proto/buf.lock
          exit 1
        fi

    # Exact diff: buf reports no compiler version, so the generated headers are
    # identical across machines. A raw protoc would stamp its own version.
    - name: Regenerate and compare
      run: |
        cd proto && buf generate && cd ..
        if ! git diff --quiet -- pkg/gen; then
          echo "::error::pkg/gen is out of date with proto/. Regenerate and commit."
          git diff -- pkg/gen
          exit 1
        fi

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest

    services:
      # Local development credentials, not secrets.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ginbot
          POSTGRES_PASSWORD: gin123
          POSTGRES_DB: ginbot
        ports:
        - 5432:5432
        # TestMain connects at once, so gate on readiness rather than boot.
        options: >-
          --health-cmd "pg_isready -U ginbot -d ginbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # The test binary runs the embedded migrations itself. -count=1 stops the
    # test cache replaying a pass against a database it never touched.
    - name: Integration tests
      env:
        GINBOT_DB_HOST: localhost
        GINBOT_DB_PORT: "5432"
        GINBOT_DB_NAME: ginbot
        GINBOT_DB_USERNAME: ginbot
        GINBOT_DB_PASSWORD: gin123
        GINBOT_LOG_LEVEL: error
      run: go test -tags=integration -race -count=1 ./...
