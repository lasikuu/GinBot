# Keep the golangci-lint version at or ahead of the go.mod toolchain: it
# type-checks through its vendored x/tools and cannot read export data from a
# newer Go, and those typecheck failures bypass the exclusion pipeline.
version: "2"

run:
  # Build the integration tag so `unused` sees the harness helpers only those
  # test files call, and holds that suite to the same rules.
  build-tags:
    - integration

issues:
  # Defaults cap a linter at 50 issues and the same text at 3, hiding findings.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck

  settings:
    govet:
      disable:
        # Opaque-API generated structs carry tags plain `go vet` rejects; must
        # match the repo's `go vet -structtag=false` or the two steps disagree.
        - structtag

  exclusions:
    # pkg/gen is generated and committed verbatim; findings there are unactionable.
    paths:
      - pkg/gen

