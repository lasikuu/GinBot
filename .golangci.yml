# golangci-lint v2 schema. Verify with `golangci-lint config verify`.
#
# Install the version CI pins, not @latest:
#
#	go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
#
# The version matters beyond reproducibility. golangci-lint type-checks through
# the x/tools it vendors, so a release cannot read compiler export data from a
# toolchain newer than itself: run an older one against a newer Go and every
# linter dies with `typecheck: could not load export data` rather than
# reporting anything. That failure cannot be excluded — typecheck issues bypass
# the exclusion pipeline — so the only fix is to keep this pin at or ahead of
# the toolchain in go.mod.
version: "2"

run:
  # Without this the integration-tagged test files are not built, and `unused`
  # then reports every harness helper only they call as dead — withTriggerServer,
  # withRepostServer, imageCandidate and newRepostServerForTest among them.
  # False positives that invite deleting live code, which is the worst possible
  # outcome from a linter. Building the tag also holds the integration suite,
  # the part that touches a real database, to the same rules as everything else.
  build-tags:
    - integration

issues:
  # Report everything. The defaults cap a linter at 50 issues and the SAME
  # issue text at 3, which is how three De Morgan findings in pkg/grpc/server
  # stood in for eight — a truncated report reads exactly like a finished one.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # Opt in explicitly rather than trimming the default set: the set of linters
  # this repository is held to should be readable here, not inferred from a
  # tool version.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck

  settings:
    govet:
      disable:
        # Protobuf generation uses the opaque API, whose generated structs
        # carry struct tags plain `go vet` rejects. This is why every vet
        # invocation in this repository is `go vet -structtag=false ./...`,
        # and it catches people out repeatedly — golangci-lint must match, or
        # `golangci-lint run` and the CI vet step disagree.
        - structtag

  exclusions:
    # pkg/gen is generated by `buf generate` and committed verbatim. Nothing there is
    # hand-editable, so a finding in it is unactionable by definition.
    paths:
      - pkg/gen

